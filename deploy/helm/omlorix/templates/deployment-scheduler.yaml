{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omlorix.fullname" . }}-scheduler
  labels:
    {{- include "omlorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "omlorix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "omlorix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "app.automations.scheduler"]
          envFrom:
            - configMapRef:
                name: {{ include "omlorix.fullname" . }}-env
            - secretRef:
                name: {{ default (printf "%s-env" (include "omlorix.fullname" .)) .Values.existingSecretName }}
          env:
            - name: DB_MIGRATIONS_MODE
              value: "off"
          {{- if include "omlorix.localFileStorageUsesPersistence" . }}
          {{- include "omlorix.localFileStorageVolumeMounts" . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- if include "omlorix.localFileStorageUsesPersistence" . }}
      {{- include "omlorix.localFileStorageVolumes" . | nindent 6 }}
      {{- end }}
{{- end }}
