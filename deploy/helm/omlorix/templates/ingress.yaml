{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "omlorix.fullname" . }}
  labels:
    {{- include "omlorix.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "omlorix.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "omlorix.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: {{ include "omlorix.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "omlorix.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ ternary (printf "%s-frontend" (include "omlorix.fullname" $)) (printf "%s-api" (include "omlorix.fullname" $)) $.Values.frontend.enabled }}
                port:
                  number: {{ ternary $.Values.frontendService.port $.Values.service.port $.Values.frontend.enabled }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
