apiVersion: v1
kind: Service
metadata:
  name: {{ include "omlorix.fullname" . }}-api
  labels:
    {{- include "omlorix.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "omlorix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
