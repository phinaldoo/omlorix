[pytest]
testpaths = tests
addopts = --import-mode=importlib
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
filterwarnings =
    # Owned dependency deprecations are regressions, not part of the warning budget.
    error::pydantic.warnings.PydanticDeprecatedSince20:^app\.
    error::sqlalchemy.exc.SADeprecationWarning:^app\.

    # Narrowly suppress known dependency noise that application code cannot fix.
    ignore:^tagMap is deprecated\. Please use TAG_MAP instead\.$:DeprecationWarning:ldap3\.utils\.asn1
    ignore:^typeMap is deprecated\. Please use TYPE_MAP instead\.$:DeprecationWarning:ldap3\.utils\.asn1
    ignore:^builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute$:DeprecationWarning
    ignore:^'_UnionGenericAlias' is deprecated and slated for removal in Python 3\.17$:DeprecationWarning:google\.genai\.types
    ignore:^Core Pydantic V1 functionality isn't compatible with Python 3\.14 or greater\.$:UserWarning:elevenlabs\.core\.pydantic_utilities
