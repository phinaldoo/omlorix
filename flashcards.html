<div id="spanish-cards">
<style>
#spanish-cards{padding:24px;max-width:760px;margin:auto}#spanish-cards .topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted-foreground);font-size:12px;letter-spacing:.08em;text-transform:uppercase}#spanish-cards .card{border:1px solid var(--border);background:var(--card);border-radius:16px;min-height:240px;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:20px 0}#spanish-cards h2{font-size:clamp(32px,5vw,46px);font-weight:550;margin:8px 0}#spanish-cards .translation{font-size:25px;margin:10px 0}#spanish-cards .example{color:var(--muted-foreground);font-size:14px}#spanish-cards .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#spanish-cards .settings{border-top:1px solid var(--border);margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#spanish-cards [hidden]{display:none}@media(max-width:400px){#spanish-cards{padding:12px}#spanish-cards .card{padding:20px 12px}}
</style>
<div class="topline"><span>Everyday Spanish · Recall practice</span><span id="cards-progress"></span></div>
<div class="card" aria-live="polite"><div class="text-small text-muted" id="cards-side"></div><h2 id="cards-front"></h2><p class="translation" id="cards-back" hidden></p><p class="example" id="cards-example"></p></div>
<div class="actions"><button class="btn btn-primary" id="cards-reveal">Reveal answer</button><button class="btn" id="cards-again" hidden>Again</button><button class="btn" id="cards-hard" hidden>Hard</button><button class="btn btn-primary" id="cards-good" hidden>Got it</button></div>
<div class="settings"><div><button class="btn btn-ghost" id="cards-shuffle">Shuffle remaining</button><button class="btn btn-ghost" id="cards-reverse">Reverse direction</button></div><button class="btn btn-ghost" id="cards-reset">Study again</button></div>
<script>
(()=>{const root=document.getElementById('spanish-cards'),find=id=>root.querySelector('#'+id),api=window.omlorix.visualization,items=[{id:'window',front:'la ventana',back:'the window',example:'Abre la ventana. — Open the window.'},{id:'key',front:'la llave',back:'the key',example:'Tengo la llave. — I have the key.'},{id:'morning',front:'la mañana',back:'the morning',example:'Estudio por la mañana. — I study in the morning.'},{id:'notebook',front:'el cuaderno',back:'the notebook',example:'Escribe en el cuaderno. — Write in the notebook.'}],ids=items.map(x=>x.id);
const fresh=(reverse=false)=>({queue:[...ids],mastered:[],reviews:0,revealed:false,reverse});let state=fresh();
function restore(raw){state=fresh();if(!raw||typeof raw!=='object')return;if(Array.isArray(raw.queue)&&Array.isArray(raw.mastered)){const both=[...raw.queue,...raw.mastered];if(both.length===ids.length&&new Set(both).size===ids.length&&both.every(id=>ids.includes(id))){state.queue=[...raw.queue];state.mastered=[...raw.mastered];}}state.reviews=Number.isInteger(raw.reviews)?Math.max(0,Math.min(raw.reviews,100000)):0;state.revealed=raw.revealed===true;state.reverse=raw.reverse===true;}
function save(){api.setWidgetState({privateContent:state,modelContent:{activity:'Spanish vocabulary',mastered:state.mastered.length,total:ids.length,reviews:state.reviews,remaining:state.queue,direction:state.reverse?'English to Spanish':'Spanish to English'}}).catch(()=>{});}
function render(){const item=items.find(x=>x.id===state.queue[0]);find('cards-progress').textContent=`${state.mastered.length} / ${ids.length} mastered · ${state.reviews} reviews`;find('cards-side').textContent=item?(state.reverse?'English → Spanish':'Spanish → English'):'All cards mastered';find('cards-front').textContent=item?(state.reverse?item.back:item.front):'Session complete';find('cards-back').textContent=item?(state.reverse?item.front:item.back):'';find('cards-back').hidden=!item||!state.revealed;find('cards-example').textContent=item?(state.revealed?item.example:'Say the meaning, then reveal the answer.'):'Come back later for another round of practice.';find('cards-reveal').hidden=!item||state.revealed;['again','hard','good'].forEach(x=>find('cards-'+x).hidden=!item||!state.revealed);find('cards-shuffle').disabled=state.queue.length<2;}
find('cards-reveal').onclick=()=>{state.revealed=true;render();save();find('cards-good').focus();};function rate(value){if(!state.revealed||!state.queue.length)return;const id=state.queue.shift();if(value==='good')state.mastered.push(id);else state.queue.splice(Math.min(value==='again'?2:4,state.queue.length),0,id);state.reviews++;state.revealed=false;render();save();find(state.queue.length?'cards-reveal':'cards-reset').focus();}['again','hard','good'].forEach(value=>find('cards-'+value).onclick=()=>rate(value));find('cards-shuffle').onclick=()=>{for(let i=state.queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]];}state.revealed=false;render();save();};find('cards-reverse').onclick=()=>{state=fresh(!state.reverse);render();save();};find('cards-reset').onclick=()=>{state=fresh(state.reverse);render();save();};restore(api.widgetState?.privateContent);render();window.addEventListener('omlorix:statechange',event=>{restore(event.detail.widgetState?.privateContent);render();});})();
</script></div>
