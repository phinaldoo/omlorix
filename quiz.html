<div id="cell-quiz">
<style>
#cell-quiz{padding:24px;max-width:760px;margin:auto}#cell-quiz .eyebrow{color:var(--muted-foreground);font-size:12px;letter-spacing:.12em;text-transform:uppercase}#cell-quiz h2{font-size:clamp(21px,3vw,28px);line-height:1.3;margin:20px 0}#cell-quiz fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}#cell-quiz label{padding:14px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer}#cell-quiz label:has(input:checked){border-color:var(--primary);background:var(--accent)}#cell-quiz input{accent-color:var(--primary)}#cell-quiz .feedback{margin:18px 0;padding:16px;border-inline-start:3px solid var(--viz-series-2);background:var(--muted);border-radius:4px}#cell-quiz .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}#cell-quiz progress{width:100%;height:5px;accent-color:var(--primary)}#cell-quiz .score{font-size:52px;font-weight:650;margin:12px 0}#cell-quiz [hidden]{display:none}@media(max-width:400px){#cell-quiz{padding:12px}}
</style>
<div class="eyebrow" id="quiz-progress"></div><progress id="quiz-bar" max="3" value="0" aria-label="Questions answered"></progress>
<div id="quiz-stage"></div><div id="quiz-feedback" class="feedback" aria-live="polite" hidden></div>
<div class="actions"><button class="btn btn-primary" id="quiz-submit">Check answer</button><button class="btn btn-primary" id="quiz-next" hidden>Next question</button><button class="btn" id="quiz-retry" hidden>Retry missed questions</button><button class="btn btn-ghost" id="quiz-reset">Start over</button></div>
<script>
(()=>{const root=document.getElementById('cell-quiz'),find=id=>root.querySelector('#'+id),api=window.omlorix.visualization;
const items=[{id:'energy',q:'Which organelle produces most of the ATP in a typical animal cell?',choices:['The nucleus','The mitochondrion','The Golgi apparatus','The lysosome'],correct:1,why:'Mitochondria convert energy from nutrients into ATP through cellular respiration.'},{id:'membrane',q:'What is the main structural basis of the cell membrane?',choices:['A phospholipid bilayer','A cellulose wall','A layer of DNA','A protein crystal'],correct:0,why:'Two layers of phospholipids form a selective barrier, with proteins embedded in it.'},{id:'ribosome',q:'What do ribosomes assemble?',choices:['Lipids','Glucose','Proteins','DNA'],correct:2,why:'Ribosomes read messenger RNA and join amino acids to build proteins.'}];
const fresh=()=>({answers:{},order:items.map(x=>x.id),index:0});let state=fresh();
function restore(raw){state=fresh();if(!raw||typeof raw!=='object')return;for(const item of items){const a=raw.answers?.[item.id];if(Number.isInteger(a)&&a>=0&&a<4)state.answers[item.id]=a;}if(Array.isArray(raw.order)&&raw.order.length&&raw.order.every(id=>items.some(x=>x.id===id))&&new Set(raw.order).size===raw.order.length)state.order=raw.order;if(Number.isInteger(raw.index))state.index=Math.max(0,Math.min(raw.index,state.order.length));}
function save(){const done=items.filter(x=>state.answers[x.id]!==undefined),missed=done.filter(x=>state.answers[x.id]!==x.correct).map(x=>x.id);api.setWidgetState({privateContent:state,modelContent:{activity:'Cell biology quiz',answered:done.length,total:items.length,correct:done.length-missed.length,missed}}).catch(()=>{});}
function render(){const item=items.find(x=>x.id===state.order[state.index]),done=items.filter(x=>state.answers[x.id]!==undefined),score=done.filter(x=>state.answers[x.id]===x.correct).length;find('quiz-progress').textContent=`CELL BIOLOGY · ${done.length} OF ${items.length} ANSWERED`;find('quiz-bar').value=done.length;const stage=find('quiz-stage');stage.replaceChildren();find('quiz-feedback').hidden=true;find('quiz-submit').hidden=!item;find('quiz-next').hidden=true;find('quiz-retry').hidden=!!item||score===items.length;
const heading=document.createElement('h2');heading.tabIndex=-1;stage.append(heading);if(!item){heading.textContent='Practice complete';const scoreNode=document.createElement('p');scoreNode.className='score';scoreNode.textContent=score+' / '+items.length;stage.append(scoreNode);const msg=document.createElement('p');msg.textContent=score===items.length?'You answered every question correctly.':'Review the explanations, or try the questions you missed.';stage.append(msg);return;}
heading.textContent=item.q;const field=document.createElement('fieldset');field.setAttribute('aria-label',item.q);stage.append(field);const answered=state.answers[item.id]!==undefined;item.choices.forEach((text,index)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='cell-answer';input.value=index;input.checked=state.answers[item.id]===index;input.disabled=answered;label.append(input,document.createTextNode(text));field.append(label);});find('quiz-submit').disabled=true;field.addEventListener('change',()=>find('quiz-submit').disabled=false);find('quiz-submit').hidden=answered;if(answered){const good=state.answers[item.id]===item.correct;find('quiz-feedback').textContent=(good?'Correct. ':'Not quite. The answer is '+item.choices[item.correct]+'. ')+item.why;find('quiz-feedback').hidden=false;find('quiz-next').hidden=false;find('quiz-next').textContent=state.index===state.order.length-1?'See results':'Next question';}}
find('quiz-submit').onclick=()=>{const item=items.find(x=>x.id===state.order[state.index]),selected=root.querySelector('input:checked');if(!item||state.answers[item.id]!==undefined||!selected)return;state.answers[item.id]=Number(selected.value);render();save();find('quiz-next').focus();};find('quiz-next').onclick=()=>{state.index=Math.min(state.index+1,state.order.length);render();save();find('quiz-stage').querySelector('h2').focus();};find('quiz-reset').onclick=()=>{state=fresh();render();save();};find('quiz-retry').onclick=()=>{state.order=items.filter(x=>state.answers[x.id]!==x.correct).map(x=>x.id);state.order.forEach(id=>delete state.answers[id]);state.index=0;render();save();};restore(api.widgetState?.privateContent);render();window.addEventListener('omlorix:statechange',event=>{restore(event.detail.widgetState?.privateContent);render();});})();
</script></div>
