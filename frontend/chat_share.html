        :root {

            --border-color: #333333;
            --hover: #2a2a2a;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        html, body {
            background-color: var(--background) !important;
            transition: none !important;
        }

        :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
            outline: 2px solid var(--admin-accent);
            outline-offset: 2px;
            border-radius: 4px;

<body class="chat-share-page" data-page="chat-share">
        <header class="chat-share-header" id="sharedHeader" hidden>
            <h1 class="chat-share-title" id="sharedChatTitle" data-i18n="chat_share_header_title">Shared Chat</h1>
            <span class="chat-share-status-badge active" data-i18n="chat_share_readonly_badge">Read only view</span>
        </header>

        <section class="chat-share-content" id="sharedChatContent" hidden>
            <div class="chat-area" id="chatArea" style="display: flex; width: 100%;">
                <div class="chat-area-container" id="chatAreaContainer"></div>
            </div>
        </section>

        <section class="chat-share-loading-view" id="sharedLoadingView">
            <div class="chat-share-loading-spinner" aria-hidden="true"></div>
            <p data-i18n="chat_share_loading_label">Loading...</p>
        </section>

        <section class="chat-share-password-view" id="sharedPasswordView" hidden>
            <h2 data-i18n="chat_share_password_title">Password required</h2>
            <p id="sharedPasswordHelp" data-i18n="chat_share_password_subtitle">This shared chat is password protected.</p>
            <form class="chat-share-password-form" id="sharedPasswordForm">
                <label class="chat-share-password-label" for="sharedPasswordInput" data-i18n="chat_share_password_label">Share password</label>
                <input type="password" id="sharedPasswordInput" autocomplete="off" required aria-describedby="sharedPasswordHelp sharedPasswordError" aria-invalid="false">
                <button type="submit" data-i18n="chat_share_password_unlock_btn">Unlock chat</button>
            </form>
            <p id="sharedPasswordError" role="alert" aria-live="polite"></p>
        </section>

        <section class="chat-share-error-view" id="sharedErrorView" hidden>
            <h2 data-i18n="chat_share_error_title">Unable to load chat</h2>
            <p id="sharedErrorMessage" data-i18n="chat_share_error_invalid_link">This share link is invalid, expired, or no longer available.</p>
            <button type="button" id="sharedRetryBtn" data-i18n="chat_share_error_retry_btn">Try again</button>
        </section>
</body>
