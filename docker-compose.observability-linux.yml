services:
  prometheus:
    labels:
      com.omlorix.installation.id: ${OMLORIX_INSTALLATION_ID:-unmanaged}
    volumes:
      - ./otel/prometheus-host-metrics-linux.yml:/etc/prometheus/host-metrics-targets.yml:ro

  node-exporter:
    labels:
      com.omlorix.installation.id: ${OMLORIX_INSTALLATION_ID:-unmanaged}
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--no-collector.filesystem'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - omlorix-network
