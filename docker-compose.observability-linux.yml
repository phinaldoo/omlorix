services:
  prometheus:
    labels:
      com.omlorix.installation.id: ${OMLORIX_INSTALLATION_ID:-unmanaged}
    volumes:
      - ./otel/prometheus-host-metrics-linux.yml:/etc/prometheus/host-metrics-targets.yml:ro

  node-exporter:
    labels:
      com.omlorix.installation.id: ${OMLORIX_INSTALLATION_ID:-unmanaged}
    image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--no-collector.filesystem'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - omlorix-network
