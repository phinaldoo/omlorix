name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        # This action is unavailable unless the repository has dependency graph
        # and GitHub Advanced Security enabled. Keep it advisory so the
        # pip-audit workflow remains the portable dependency security gate.
        continue-on-error: true
