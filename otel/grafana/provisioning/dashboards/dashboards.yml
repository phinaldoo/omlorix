# Grafana Dashboard Provisioning for Omlorix
# Auto-loads dashboards from the dashboards directory

apiVersion: 1

providers:
  - name: 'Omlorix Dashboards'
    orgId: 1
    folder: 'Omlorix'
    folderUid: 'omlorix'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
