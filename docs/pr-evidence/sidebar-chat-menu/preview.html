<!doctype html>
<html lang="en" data-mode="light">
<meta charset="utf-8">
<title>Sidebar chat menu verification</title>
<link rel="stylesheet" href="../../../frontend/css/fonts.css">
<link rel="stylesheet" href="../../../frontend/css/common/init.css">
<link rel="stylesheet" href="../../../frontend/css/common/elements.css">
<link rel="stylesheet" href="../../../frontend/css/common/animations.css">
<link rel="stylesheet" href="../../../frontend/css/chat/sidebar.css">
<link rel="stylesheet" href="../../../frontend/css/chat/projectSidebar.css">
<style>
    body { display: flex; }
    main { padding: 24px; max-width: 360px; }
    main p { margin-top: 12px; color: var(--text-color-secondary); font-size: 14px; }
    .sidebar-container { padding-top: 16px; }
</style>
<aside class="sidebar-container" aria-label="Chat history">
    <div class="sidebar-main">
        <section class="sidebar-section" id="history">
            <div class="sidebar-section-header">Chats</div>
            <div class="chat-time-divider"><span class="chat-time-divider-label">Last 7 Days</span></div>
            <div id="chatsContainer"></div>
        </section>
        <section class="sidebar-section" id="pinnedChats">
            <div class="sidebar-section-header">Pinned</div>
            <div id="pinnedChatsContainer"></div>
        </section>
    </div>
</aside>
<main>
    <h2>Sidebar chat titles</h2>
    <p>Production chat rows, icons, fonts, and styles with local sample data.</p>
    <p>Move over a chat or tab to its menu button. The unread row keeps its indicator space.</p>
</main>
<script src="../../../frontend/js/common/icons.js"></script>
<script src="../../../frontend/js/common/chatTitleUtils.js"></script>
<script>
    // No backend is needed for this isolated visual fixture.
    window.authedFetch = () => new Promise(() => {});
    function closeAllChatDropdowns() {
        document.querySelectorAll('.select-dropdown.open').forEach(menu => menu.classList.remove('open'));
    }
    async function openChatWithProjectContext() {}
</script>
<script src="../../../frontend/js/chat/chatAttention.js"></script>
<script src="../../../frontend/js/chat/chatsHelper.js"></script>
<script>
    const titles = [
        'TLDR Summary Request',
        'Casual Greeting',
        'Array vs. Queue with Heap Examples',
        'Group Axiom Assignments',
        'VS Code Kotlin Syntax Highlighting',
        'Exponential Function Limits',
        'Unread assistant response example',
    ];
    titles.forEach((title, index) => chatsContainer.appendChild(createChatRow({
        id: `sample-${index}`, title, pinned_position: null,
        has_unread_response: index === titles.length - 1,
    })));
    pinnedContainer.appendChild(createChatRow({
        id: 'pinned-example', title: 'Pinned chat with a longer title', pinned_position: 0,
    }));
</script>
</html>
