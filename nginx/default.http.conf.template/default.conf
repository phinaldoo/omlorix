        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors on;
    }

    location /openapi.json {
        proxy_pass http://fastapi:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors on;
    }

    location = /change_password {
