    }

    location ^~ /canvas/shared/ {
        access_log off;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; frame-src 'self' blob: data: https://www.youtube-nocookie.com https://docs.google.com https://drive.google.com https://accounts.google.com; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://apis.google.com; connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /canvas_share.html =404;
    }

    location ^~ /chats/shared/ {
        access_log off;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; frame-src 'self' blob: data: https://www.youtube-nocookie.com https://docs.google.com https://drive.google.com https://accounts.google.com; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://apis.google.com; connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /chat_share.html =404;
    }

    location ~* \.map$ {
        default_type application/json;
        return 200 '{"version":3,"file":"stub.map","sources":[],"names":[],"mappings":""}';
    }

    location ~* \.html$ {
        expires -1;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; frame-src 'self' blob: data: https://www.youtube-nocookie.com https://docs.google.com https://drive.google.com https://accounts.google.com; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://apis.google.com; connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/i18n/.+\.json$ {
        add_header Cache-Control $i18n_cache_control always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
