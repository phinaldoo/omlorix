# The launcher-to-nginx hop is authenticated with an installation-specific
# secret. Direct ingress never consumes client-controlled forwarding headers.
map_hash_bucket_size 128;
map $http_x_omlorix_launcher_secret $omlorix_launcher_authenticated {
    default 0;
    "__LAUNCHER_PROXY_SECRET__" __LAUNCHER_PROXY_AUTH_VALUE__;
}

# External proxies use an explicit network allowlist. The renderer accepts only
# IP/CIDR tokens, and the proxy must overwrite X-Forwarded-For with one address.
geo $omlorix_external_upstream_trusted {
    default 0;
    __TRUSTED_EXTERNAL_UPSTREAMS__
}

# Ask nginx's native address parser to reject malformed or chained values.
geo $http_x_forwarded_for $omlorix_forwarded_address_valid {
    0.0.0.0/0 1;
    ::/0 1;
    # nginx represents an unparsable variable address as this sentinel. Reject
    # it explicitly instead of letting the enclosing IPv4 range accept it.
    255.255.255.255 0;
}

# A canonical visitor value is one token. This independently rejects lists and
# whitespace before the native address-parser result can authorize the value.
map $http_x_forwarded_for $omlorix_forwarded_address_single {
    default 1;
    "" 0;
    ~[,[:space:]] 0;
}

# The launcher and an explicitly allowlisted external edge emit exactly one
# canonical address. Anything else fails closed to nginx's observed peer.
map "$omlorix_launcher_authenticated:$omlorix_external_upstream_trusted:$omlorix_forwarded_address_valid:$omlorix_forwarded_address_single" $omlorix_client_ip {
    default $remote_addr;
    ~^1:[01]:1:1$ $http_x_forwarded_for;
    "0:1:1:1" $http_x_forwarded_for;
}

map "$omlorix_launcher_authenticated:$omlorix_external_upstream_trusted:$http_x_forwarded_proto" $omlorix_request_scheme {
    default $scheme;
    ~^1:[01]:http$ http;
    ~^1:[01]:https$ https;
    "0:1:http" http;
    "0:1:https" https;
}

map "$omlorix_launcher_authenticated:$uri" $omlorix_verification_secret {
    default "";
    "1:/api/v1/proxy-verification" "__LAUNCHER_PROXY_SECRET__";
}

limit_req_zone $omlorix_client_ip zone=api_limit_per_ip:10m rate=100r/s;
limit_req_zone $omlorix_client_ip zone=signup_limit_per_ip:2m rate=3r/m;
limit_req_zone $omlorix_client_ip zone=shared_chat_access_limit_per_ip:2m rate=120r/m;
limit_conn_zone $omlorix_client_ip zone=conn_limit_per_ip:10m;

log_format omlorix_access '$omlorix_client_ip - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
map $arg_v $i18n_cache_control {
    "" "no-cache";
    default "public, max-age=31536000, immutable";
}

# Share IDs are bearer capabilities and must not be written to the access log.
# Page locations also disable logging directly below. This map covers API paths,
# including requests whose query strings contain an additional share credential.
map $uri $omlorix_access_log_enabled {
    default 1;
    ~^/(?:canvas|chats)/shared/ 0;
    ~^/(?:notes|todos|skills|prompts|agents|folders)/(?:clone|live|collaborate)/ 0;
    ~^/projects/join/ 0;
    ~^/api/v1/(?:chats/shared|files/canvas/shared)(?:/|$) 0;
    ~^/api/v1/(?:notes|prompts|skills|projects|file-folders)/(?:shared|clone)(?:/|$) 0;
    ~^/api/v1/todo/(?:shared|clone)(?:/|$) 0;
    ~^/api/v1/agents/shared(?:/|$) 0;
}

server {
    # Defining the log at server scope replaces nginx's inherited combined log,
    # so every logged request has one identity: the normalized visitor IP. The
    # map above suppresses requests that could expose a bearer share capability.
    access_log /var/log/nginx/access.log omlorix_access if=$omlorix_access_log_enabled;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Render the static error document without replacing the originating HTTP
    # status. Monitoring, reverse proxies, and clients must still see the real
    # server or gateway failure instead of a successful-looking redirect.
    error_page 500 504 /error.html;

    # Per-client connection cap (helps protect WebSocket endpoints too)
    # Allow higher concurrency so dashboards can fan out without tripping 503s
    limit_conn conn_limit_per_ip 160;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; frame-src 'self' blob: data: https://www.youtube-nocookie.com https://docs.google.com https://drive.google.com https://accounts.google.com; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://apis.google.com; connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Signup endpoint gets its own hard cap (3/min per IP)
    location = /api/v1/auth/signup {
        limit_req zone=signup_limit_per_ip nodelay;

        proxy_pass http://fastapi:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        client_max_body_size 1M;
        client_body_timeout 15s;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # Authentication bodies are small JSON or bounded federated-login form
    # posts. Keep this independent edge cap aligned with the FastAPI ASGI cap.
    location ^~ /api/v1/auth/ {
        limit_req zone=api_limit_per_ip burst=40 nodelay;

        proxy_pass http://fastapi:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        client_max_body_size 1M;
        client_body_timeout 15s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location = /api/v1/chats/shared/access {
        limit_req zone=shared_chat_access_limit_per_ip burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://fastapi:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        client_max_body_size 1M;
        client_body_timeout 15s;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /api/v1/chats/shared/files/ {
        limit_req zone=shared_chat_access_limit_per_ip burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://fastapi:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        client_max_body_size 1M;
        client_body_timeout 15s;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~ ^/(health|healthz|ready)$ {
        proxy_pass http://fastapi:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store, private" always;
    }

    # Long-lived WebSocket/WebRTC sideband traffic scales independently from
    # ordinary request/response APIs. The gateway itself rejects every route
    # outside this prefix as a second boundary behind nginx.
    location ^~ /api/v1/realtime/ {
        limit_req zone=api_limit_per_ip burst=200 nodelay;

        proxy_pass http://realtime_gateway:8001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        # Never forward public client-controlled trusted-header SSO assertions.
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-Forwarded-Given-Name "";
        proxy_set_header X-Forwarded-Family-Name "";
        proxy_set_header X-Forwarded-Display-Name "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Trusted-Auth-Secret "";
        proxy_intercept_errors off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 512M;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-store, private" always;
    }


    # Only named upload, import, transcription, and large editor-save routes
    # retain the historical upload-scale allowance. FastAPI independently
    # applies the same method-and-path allowlist and counts streamed bytes.
    location ~ "^/api/v1/(?:files/(?:upload|canvas/(?:save|spreadsheet/save|markdown/pdf|latex/render))|chats/(?:import/chatgpt|meetings/transcribe)|llm/transcribe|users/import/self|admin/(?:users/import|ip-address/statistics/import|import/openwebui/chats(?:/bulk)?)|agents/[^/]+/assets|skills/(?:import-markdown-files|admin/(?:import-files|[^/]+/files/[^/]+)|(?!admin/)[^/]+/files/[^/]+)|presentations/[^/]+/editor)/?$" {
        limit_req zone=api_limit_per_ip burst=200 nodelay;

        proxy_pass http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        client_max_body_size 512M;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }


    # Proxy all other API requests to FastAPI service
    location /api/ {
        # Rate-limit bursts of API calls per client IP (softer global limit)
        limit_req zone=api_limit_per_ip burst=200 nodelay;

        proxy_pass http://fastapi:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors off;
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        client_max_body_size 16M;
        client_body_timeout 60s;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;

        # IMPORTANT: enable streaming by disabling buffering and compression
        proxy_buffering off;          # do not buffer upstream responses
        proxy_cache off;              # ensure no caching interferes
        gzip off;                     # disable gzip in this location to avoid buffering
        chunked_transfer_encoding on; # allow chunked responses to flush progressively
        # Also explicitly tell Nginx not to buffer even if upstream doesn't set it
        add_header X-Accel-Buffering no;
    }

    # FastAPI docs and schema
    location /docs {
        proxy_pass http://fastapi:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Omlorix-Launcher-Secret "";
        proxy_set_header X-Omlorix-Proxy-Verification $omlorix_verification_secret;
        proxy_set_header X-Omlorix-Proxy-Verification-Nonce $http_x_omlorix_verification_nonce;
        proxy_intercept_errors on;
    }

    location /redoc {
        proxy_pass http://fastapi:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $omlorix_client_ip;
        proxy_set_header X-Forwarded-For __X_FORWARDED_FOR_VALUE__;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $omlorix_request_scheme;
        proxy_set_header X-Forwarded-Host $host;
